name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Validate tag and package version
        run: |
          python - <<'PY'
          import ast
          import os
          import tomllib
          from pathlib import Path

          project_version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          module = ast.parse(Path("src/subtitleops/__init__.py").read_text())
          package_version = next(
              ast.literal_eval(node.value)
              for node in module.body
              if isinstance(node, ast.Assign)
              and any(isinstance(target, ast.Name) and target.id == "__version__" for target in node.targets)
          )
          if project_version != package_version:
              raise SystemExit(
                  f"pyproject version {project_version!r} does not match package version {package_version!r}"
              )
          tag = os.environ["GITHUB_REF_NAME"]
          expected = f"v{project_version}"
          if tag != expected:
              raise SystemExit(f"tag {tag!r} does not match package version {expected!r}")
          PY
      - name: Test
        run: |
          python -m pip install -e .
          python -m pip check
          python -m unittest discover -s tests -v
          python -m compileall -q src tests
      - name: Build
        run: |
          python -m pip install "build>=1.2,<2"
          python -m build
      - name: Smoke-install wheel
        run: |
          python -m venv .release-smoke
          .release-smoke/bin/python -m pip install --no-deps dist/*.whl
          .release-smoke/bin/python -m pip check
          .release-smoke/bin/subtitleops --version
          .release-smoke/bin/subtitleops check examples/clean.srt examples/clean.vtt --no-config
      - name: Generate checksums
        run: sha256sum dist/* > dist/SHA256SUMS
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
