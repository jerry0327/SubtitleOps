name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Validate tag and repository metadata
        run: |
          python scripts/validate_repository.py
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          project_version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          expected = f"v{project_version}"
          if tag != expected:
              raise SystemExit(f"tag {tag!r} does not match package version {expected!r}")
          PY
      - name: Test
        run: |
          python -m pip install -e .
          python -m pip check
          python -m unittest discover -s tests -v
          python -m compileall -q src tests scripts
      - name: Build
        run: |
          python -m pip install "build>=1.2,<2"
          python -m build
      - name: Smoke-install wheel
        run: |
          python -m venv .release-smoke
          .release-smoke/bin/python -m pip install --no-deps dist/*.whl
          .release-smoke/bin/python -m pip check
          .release-smoke/bin/subtitleops --version
          .release-smoke/bin/subtitleops check examples/clean.srt examples/clean.vtt examples/clean.ttml --no-config
          .release-smoke/bin/subtitleops convert examples/clean.srt /tmp/release-clean.ttml
          .release-smoke/bin/subtitleops check /tmp/release-clean.ttml --no-config
      - name: Generate checksums
        run: sha256sum dist/* > dist/SHA256SUMS
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag --title "SubtitleOps ${GITHUB_REF_NAME#v}"
      - name: Move floating v0 action tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v0" >/dev/null 2>&1; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/v0" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/v0" -f sha="$GITHUB_SHA" >/dev/null
          fi
