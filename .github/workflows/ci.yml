name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: |
          python -m pip install -e .
          python -m pip check
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile package and tests
        run: python -m compileall -q src tests
      - name: CLI smoke tests
        run: |
          subtitleops --version
          subtitleops rules --json > /tmp/rules.json
          subtitleops check examples/clean.srt examples/clean.vtt --no-config
      - name: Validate machine-readable reports
        run: |
          mkdir -p build/ci
          subtitleops check examples/clean.srt --json --no-config -o build/ci/subtitleops.json
          subtitleops check examples/clean.srt --sarif --no-config -o build/ci/subtitleops.sarif
          python - <<'PY'
          import json
          from pathlib import Path

          json_report = json.loads(Path("build/ci/subtitleops.json").read_text())
          sarif = json.loads(Path("build/ci/subtitleops.sarif").read_text())
          assert json_report["schema_version"] == 1
          assert json_report["summary"]["exit_code"] == 0
          assert sarif["version"] == "2.1.0"
          assert sarif["runs"][0]["invocations"][0]["exitCode"] == 0
          PY

  package:
    name: Build and smoke-install package
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - name: Build distributions
        run: |
          python -m pip install "build>=1.2,<2"
          python -m build
      - name: Smoke-install wheel in clean environment
        run: |
          python -m venv .wheel-smoke
          .wheel-smoke/bin/python -m pip install --no-deps dist/*.whl
          .wheel-smoke/bin/python -m pip check
          .wheel-smoke/bin/subtitleops --version
          .wheel-smoke/bin/subtitleops rules --json > /tmp/wheel-rules.json
          .wheel-smoke/bin/subtitleops check examples/clean.srt examples/clean.vtt --no-config
      - uses: actions/upload-artifact@v7
        with:
          name: subtitleops-distributions
          path: dist/
          if-no-files-found: error
